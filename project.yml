# Source of truth for the Xcode project. Run `xcodegen generate`; the .xcodeproj is not committed.
name: Talkboard
options:
  bundleIdPrefix: com.brendanphall
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  TalkboardCore:
    path: Packages/TalkboardCore
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "2"
targets:
  Talkboard:
    type: application
    platform: iOS
    sources: [App]
    dependencies:
      - package: TalkboardCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.brendanphall.talkboard.public
        TARGETED_DEVICE_FAMILY: "2"        # iPad only
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Talkboard Demo
        INFOPLIST_KEY_NSFaceIDUsageDescription: "Unlock caregiver controls. Speech is always available."
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        CODE_SIGN_STYLE: Automatic
  TalkboardTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: Talkboard
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "2"
  TalkboardUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: Talkboard
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "2"
schemes:
  Talkboard:
    build:
      targets:
        Talkboard: all
    test:
      targets:
        - package: TalkboardCore/TalkboardCoreTests
        - TalkboardTests
        - TalkboardUITests
